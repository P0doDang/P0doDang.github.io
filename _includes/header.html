<header class="site-header">
<div class="wrap">
<nav class="nav" aria-label="주 메뉴">
<a class="brand" href="{{ '/' | relative_url }}">{{ site.data.profile.name | default: site.title }}</a>
<ul class="nav-links">
<li><a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>홈</a></li>
<li><a href="{{ '/categories/' | relative_url }}"{% if page.url contains '/categories/' %} aria-current="page"{% endif %}>카테고리</a></li>
<li><a href="{{ '/tags/' | relative_url }}"{% if page.url contains '/tags/' %} aria-current="page"{% endif %}>태그</a></li>
<li><a href="{{ '/archives/' | relative_url }}"{% if page.url contains '/archives/' %} aria-current="page"{% endif %}>전체 글</a></li>
<li><a href="{{ '/about/' | relative_url }}"{% if page.url contains '/about/' %} aria-current="page"{% endif %}>소개</a></li>
<li><button class="theme-toggle" type="button" aria-label="다크 모드로 전환" title="다크 모드로 전환">
<svg class="i-moon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" fill="currentColor"/></svg>
<svg class="i-sun" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="currentColor"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
</button></li>
</ul>
</nav>
</div>
</header>
<script>
(function(){
  var b=document.querySelector('.theme-toggle'); if(!b) return;
  var root=document.documentElement;
  function isDark(){return root.getAttribute('data-theme')==='dark'}
  function sync(){var l=isDark()?'라이트 모드로 전환':'다크 모드로 전환'; b.setAttribute('aria-label',l); b.title=l}
  b.addEventListener('click',function(){
    var n=isDark()?'light':'dark';
    root.setAttribute('data-theme',n);
    try{localStorage.setItem('theme',n)}catch(e){}
    sync();
  });
  sync();
})();
</script>
