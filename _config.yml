# 사이트 기본 설정 (테마 없이 직접 만든 레이아웃을 사용해요)

lang: ko-KR
timezone: Asia/Seoul

title: P0doDang's Blog
tagline: 그건좀안이당 # 홈 화면 큰 이름 아래에 표시돼요
description: >- # 검색/공유 미리보기에 쓰여요
  보안과 개발을 공부하며 풀어낸 과정을 기록하는 블로그예요.

# 끝에 `/`를 붙이지 않아요.
url: "https://p0dodang.github.io"
baseurl: ""

github:
  username: P0doDang

twitter:
  username: PododangSugar

social:
  name: P0odoDang
  email: lucas7073@naver.com

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: false

plugins:
  - jekyll-archives

# 카테고리/태그 페이지 자동 생성: /categories/이름/, /tags/이름/
jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    category: /categories/:name/
    tag: /tags/:name/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      permalink: /posts/:title/

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - tools
  - vendor
  - node_modules
